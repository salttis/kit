name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
          check-latest: true
      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [[ -n "$files" ]]; then printf 'Go files need gofmt:\n%s\n' "$files"; exit 1; fi
      - run: go vet ./...
      - run: go build -trimpath ./...
      - run: go test ./...
